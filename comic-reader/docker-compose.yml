services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: comicdb
      POSTGRES_USER: comicuser
      POSTGRES_PASSWORD: comicpass
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: comicdb
      DB_USER: comicuser
      DB_PASSWORD: comicpass
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: djangoinsecurechangeme
      DEBUG: "True"

volumes:
  postgres_data:
  media_volume: